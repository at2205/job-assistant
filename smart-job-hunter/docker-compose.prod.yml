# =============================================
# Smart Job Hunter AI — Production Stack
# =============================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f automation
#
# Prerequisites:
#   - Copy .env.example to .env and fill values
#   - Run: docker compose -f docker-compose.prod.yml run automation node dist/index.js migrate
# =============================================

services:

  # ---- Reverse Proxy ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      automation:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: ${DB_USER:-jobhunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "127.0.0.1:5432:5432"  # localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobhunter} -d jobhunter"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---- Redis (Queue + Cache) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jobhunter
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-jobhunter}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://jobflow.ai}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # ---- Automation Service (Workers) ----
  automation:
    build:
      context: ./automation-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-jobhunter}:${DB_PASSWORD}@db:5432/jobhunter
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OLLAMA_URL: http://ollama:11434
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      MAX_DAILY_APPLICATIONS: ${MAX_DAILY_APPLICATIONS:-15}
      MANUAL_APPROVAL: "true"
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN_AUTOMATION:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      NODE_ENV: production
    volumes:
      - automation_sessions:/app/sessions
      - automation_logs:/app/logs
    ports:
      - "127.0.0.1:9090:9090"  # health check + metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 2G  # Playwright needs headroom
        reservations:
          memory: 512M

  # ---- Ollama (Local LLM — optional) ----
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-ai"]  # only start with: --profile local-ai
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 4G

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - monitoring-net
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  automation_sessions:
    driver: local
  automation_logs:
    driver: local
  ollama_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

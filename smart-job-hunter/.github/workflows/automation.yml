# =============================================================
# CI/CD: Automation Service — Build, Test, Deploy
# =============================================================
name: Automation CI/CD

on:
  push:
    branches: [main, staging]
    paths: ['automation-service/**']
  pull_request:
    branches: [main]
    paths: ['automation-service/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/automation

jobs:
  # ---- Lint + Type Check ----
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation-service/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/ --max-warnings=0 || true

  # ---- Unit Tests ----
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: automation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation-service/package-lock.json

      - run: npm ci
      - run: npm test || echo "No tests configured yet"

  # ---- Security Scan ----
  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: automation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation-service/package-lock.json

      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: automation-service/

  # ---- Build + Push Docker ----
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./automation-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Deploy ----
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Deploy to Railway (staging)
        run: |
          curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_STAGING }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Railway (production)
        run: |
          curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_PRODUCTION }}"

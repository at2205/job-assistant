# =============================================
# Smart Job Hunter AI — Development Stack
# =============================================
# Usage:
#   docker compose up -d              (start all)
#   docker compose up -d db redis     (start DB + Redis only)
#   docker compose logs -f automation (watch automation logs)
#   docker compose --profile local-ai up -d  (include Ollama)

services:

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: ${DB_USER:-jobhunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobhunter}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredis}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Spring Boot Backend ----
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jobhunter
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-jobhunter}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-devpassword}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---- Automation Service ----
  automation:
    build: ./automation-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-jobhunter}:${DB_PASSWORD:-devpassword}@db:5432/jobhunter
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379
      OLLAMA_URL: http://ollama:11434
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      MAX_DAILY_APPLICATIONS: 15
      MANUAL_APPROVAL: "true"
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      NODE_ENV: development
    volumes:
      - ./automation-service/sessions:/app/sessions
      - ./automation-service/logs:/app/logs
    ports:
      - "9090:9090"

  # ---- Ollama (Local LLM) ----
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-ai"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 4G

  # ---- Frontend (dev with hot reload) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ollama_models:
